<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bakaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="wordmark">Bakaya</span>
      <nav aria-label="Main">
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/customers" data-tab="customers">Customers</a>
        <a href="#/ask" data-tab="ask">Ask</a>
      </nav>
      <button class="btn btn-primary" type="button" data-add-sale>+ Add sale</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="bottombar" aria-label="Main">
    <div class="bottombar-inner">
      <a href="#/today" data-tab="today">Today</a>
      <a href="#/customers" data-tab="customers">Customers</a>
      <a href="#/ask" data-tab="ask">Ask</a>
      <button class="btn btn-primary" type="button" data-add-sale>+ Add sale</button>
    </div>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" class="btn-link" type="button" hidden></button>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
