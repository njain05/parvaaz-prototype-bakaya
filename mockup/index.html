/* ---------- helpers (become static/js/lib.js) ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
function lakh(n) {
  if (Math.abs(n) < 100000) return inr(n);
  return "₹" + (n / 100000).toFixed(2).replace(/\.?0+$/, "") + " lakh";
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(iso, withYear = false) {
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${MONTHS[m - 1]}` + (withYear || y !== Number(TODAY.slice(0, 4)) ? ` ${y}` : "");
}
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

function toast(text, {action} = {}) {
  const el = $("#toast"), btn = $("#toast-action");
  $("#toast-text").textContent = text;
  btn.hidden = !action;
  if (action) {
    btn.textContent = action.label;
    btn.onclick = () => { el.hidden = true; action.onClick(); };
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 6000);
}
const notInMockup = what => toast(`${what} is not in this mockup yet.`);

const sheet = $("#sheet");
function openSheet(html) {
  sheet.innerHTML = html;
  if (!sheet.open) sheet.showModal();
}
function closeSheet() { if (sheet.open) sheet.close(); }
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });

/* ---------- contact log (mirrors contact_log.py) ---------- */
function recentlyReminded(customerId) {
  return contacts.some(c => c.customer_id === customerId && c.kind === "reminder" && daysBetween(c.date, TODAY) < 5);
}

/* ---------- screen: today ---------- */
function rowHtml(r, group) {
  const c = customer(r.customer_id);
  const late = group === "late";
  return `
    <li class="row" data-customer="${c.id}" tabindex="0">
      <div class="row-name">${esc(c.name)}</div>
      <div class="row-right">
        <div class="amount ${late ? "late" : ""}">${lakh(r.amount)}<span class="amount-label">${late ? "late" : "due " + fmtDate(r.due_date)}</span></div>
      </div>
      <div class="row-sub">${esc(c.city)}</div>
      <p class="row-why">${esc(r.why)}</p>
      <div class="row-actions"><button class="btn" type="button" data-remind="${c.id}">Send reminder</button></div>
    </li>`;
}

function renderToday(el) {
  const t = BOOK.totals;
  const late = TODAY_ROWS.late.filter(r => !recentlyReminded(r.customer_id));
  const soon = TODAY_ROWS.coming_up.filter(r => !recentlyReminded(r.customer_id));
  const group = (title, rows, key, empty) => `
    <div class="section-head"><h2>${title}</h2><span class="count">${rows.length} ${rows.length === 1 ? "customer" : "customers"}</span></div>
    ${rows.length ? `<ul class="rows">${rows.map(r => rowHtml(r, key)).join("")}</ul>` : `<p class="today-empty">${empty}</p>`}`;
  el.innerHTML = `
    <div class="page-head">
      <span class="eyebrow">Sunday, 15 November</span>
      <h1 class="page-title">Today</h1>
      <p class="totals"><strong>${lakh(t.outstanding)}</strong> owed to you · <strong class="late">${lakh(t.overdue)}</strong> late</p>
    </div>
    ${group("Late", late, "late", "Nobody is late. Well done.")}
    ${group("Coming up", soon, "coming_up", "Nothing due in the next 7 days.")}`;
}

/* ---------- screen: customers ---------- */
function renderCustomers(el) {
  const list = [...BOOK.customers].sort((a, b) => a.name.localeCompare(b.name));
  el.innerHTML = `
    <div class="page-head"><h1 class="page-title">Customers</h1></div>
    <div class="field customers-search">
      <label for="cust-search" class="visually-hidden">Search customers</label>
      <input id="cust-search" class="input" type="search" placeholder="Search by name or city" autocomplete="off">
    </div>
    <ul class="rows customers" id="cust-list"></ul>`;
  const draw = q => {
    q = q.trim().toLowerCase();
    $("#cust-list", el).innerHTML = list
      .filter(c => !q || (c.name + " " + c.city).toLowerCase().includes(q))
      .map(c => `
        <li class="row" data-customer="${c.id}" tabindex="0">
          <div><div class="row-name">${esc(c.name)}</div><div class="row-sub">${esc(c.city)}</div></div>
          <div class="row-right"><div class="amount ${c.overdue > 0.5 ? "late" : ""}">${c.outstanding > 0.5 ? lakh(c.outstanding) : "Paid up"}
            <span class="amount-label">${c.overdue > 0.5 ? lakh(c.overdue) + " late" : c.outstanding > 0.5 ? "owed" : ""}</span></div></div>
        </li>`).join("") || `<p class="today-empty">No customer matches that.</p>`;
  };
  $("#cust-search", el).addEventListener("input", e => draw(e.target.value));
  draw("");
}

/* ---------- screen: customer ---------- */
function habitWords(c) {
  if (c.avg_days_late == null) return "New customer, no payment history yet.";
  if (c.avg_days_late <= 7) return "Usually pays on time.";
  if (c.avg_days_late >= 25 && c.avg_days_late <= 35) return "Usually pays about a month late.";
  return `Usually pays about ${c.avg_days_late} days late.`;
}

function saleHtml(o) {
  const items = o.milestones.map(m => {
    if (m.status === "paid") return `
      <li class="is-paid"><span class="inst-mark" aria-label="Paid">✓</span><span class="inst-label">${esc(m.label)}</span>
        <span class="inst-amt">${inr(m.amount)}</span><span class="inst-note">Due ${fmtDate(m.due_date)} · paid ${fmtDate(m.paid_on)}</span></li>`;
    const part = m.partly_paid ? ` · ${inr(m.amount - m.unpaid)} of ${inr(m.amount)} paid` : "";
    if (m.status === "overdue") return `
      <li class="is-late"><span class="inst-mark" aria-hidden="true">!</span><span class="inst-label">${esc(m.label)}</span>
        <span class="inst-amt">${inr(m.unpaid)}</span><span class="inst-note">Due ${fmtDate(m.due_date)} · ${daysBetween(m.due_date, TODAY)} days late${part}</span></li>`;
    return `
      <li class="is-upcoming"><span class="inst-mark" aria-hidden="true">·</span><span class="inst-label">${esc(m.label)}</span>
        <span class="inst-amt">${inr(m.unpaid)}</span><span class="inst-note">Due ${fmtDate(m.due_date)}${part}${daysBetween(TODAY, m.due_date) <= 7 ? `, in ${daysBetween(TODAY, m.due_date)} days` : ""}</span></li>`;
  }).join("");
  const state = o.balance <= 0.5 ? "Paid in full" : `${inr(o.paid)} paid · ${inr(o.balance)} to come`;
  return `
    <div class="sale">
      <div class="sale-head"><span class="sale-name">${esc(o.machine)}</span><span class="num">${inr(o.total)}</span></div>
      <div class="sale-meta">Sold ${fmtDate(o.order_date, true)} · ${state}</div>
      <ul class="inst">${items}</ul>
    </div>`;
}

const LANG_NAMES = {hinglish: "Hinglish", hindi: "Hindi", punjabi: "Punjabi", english: "English"};
function historyOf(c) {
  const machineOf = id => BOOK.orders.find(o => o.id === id)?.machine ?? "";
  const pays = ordersOf(c.id).flatMap(o => o.payments.map(p => ({date: p.date, sort: p.id, kind: "payment", ...p, machine: o.machine})));
  const cons = contacts.filter(x => x.customer_id === c.id).map(x => ({...x, sort: 1000 + x.id, machine: machineOf(x.order_id)}));
  return [...pays, ...cons].sort((a, b) => b.date.localeCompare(a.date) || b.sort - a.sort).map(h => {
    let what, detail;
    if (h.kind === "payment") { what = `Paid ${inr(h.amount)}`; detail = [h.mode, h.machine].filter(Boolean).join(" · "); }
    else if (h.kind === "reminder") { what = "Reminder sent on WhatsApp"; detail = LANG_NAMES[h.language] || ""; }
    else {
      const broken = h.promised_date < TODAY && !pays.some(p => p.date > h.date);
      what = `Promised ${lakh(h.promised_amount)} by ${fmtDate(h.promised_date)}`;
      detail = [broken ? "Not received" : "", h.note].filter(Boolean).join(" · ");
      if (broken) return `<li><time datetime="${h.date}">${fmtDate(h.date)}</time><div><div class="what late">${esc(what)}</div><div class="detail">${esc(detail)}</div></div></li>`;
    }
    return `<li><time datetime="${h.date}">${fmtDate(h.date)}</time><div><div class="what">${esc(what)}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ""}</div></li>`;
  }).join("");
}

function renderCustomer(el, id) {
  const c = customer(id);
  if (!c) { location.hash = "#customers"; return; }
  const owes = c.outstanding > 0.5
    ? `Owes ${lakh(c.outstanding)}${c.overdue > 0.5 ? `<span class="sep">·</span><span class="late">${lakh(c.overdue)} late (${c.days_overdue} days)</span>` : ""}`
    : "Paid up";
  const history = historyOf(c);
  el.innerHTML = `
    <a class="back" href="${esc(lastList)}">‹ ${lastList === "#customers" ? "Customers" : "Today"}</a>
    <div class="cust-head">
      <h1 class="page-title">${esc(c.name)}</h1>
      <p class="cust-meta">${esc(c.contact_person)} · ${esc(c.city)} · <span class="num">${esc(c.phone)}</span></p>
      <div class="btn-row">
        <button class="btn" type="button" data-todo="Calling">Call</button>
        <button class="btn" type="button" data-todo="Opening a WhatsApp chat">WhatsApp</button>
      </div>
    </div>
    <div class="cust-summary">
      <p class="cust-owes">${owes}</p>
      <p class="cust-habit">${habitWords(c)}</p>
    </div>
    <div class="btn-row cust-actions">
      ${c.remind_order_id ? `<button class="btn btn-primary" type="button" data-remind="${c.id}">Send reminder</button>` : ""}
      <button class="btn" type="button" data-todo="Record payment">Record payment</button>
      <button class="btn" type="button" data-todo="Note a promise">Note a promise</button>
    </div>
    <div class="section-head"><h2>Machines</h2><span class="count">${ordersOf(c.id).length} ${ordersOf(c.id).length === 1 ? "sale" : "sales"}</span></div>
    ${ordersOf(c.id).map(saleHtml).join("")}
    <div class="section-head"><h2>History</h2></div>
    ${history ? `<ul class="history">${history}</ul>` : `<p class="today-empty">No payments or reminders yet.</p>`}`;
}

/* ---------- reminder sheet ---------- */
const LANGS = [["hinglish", "Hinglish"], ["hindi", "हिंदी"], ["punjabi", "ਪੰਜਾਬੀ"], ["english", "English"]];
const TONES = ["upcoming", "gentle", "firm", "serious"];
const TONE_WORDS = {upcoming: "Friendly", gentle: "Gentle", firm: "Firm", serious: "Serious"};

function reminderFacts(c) {
  const o = BOOK.orders.find(x => x.id === c.remind_order_id);
  let amount, due;
  if (o.overdue > 0.5) { amount = o.overdue; due = o.milestones.find(m => m.status === "overdue").due_date; }
  else { amount = o.next_due.amount; due = o.next_due.due_date; }
  // PLAN.md rule 7: tone from days late, one step firmer per reminder since the last payment.
  const lastPay = ordersOf(c.id).flatMap(x => x.payments).map(p => p.date).sort().pop() || "";
  const reminders = contacts.filter(x => x.customer_id === c.id && x.kind === "reminder" && x.date > lastPay).length;
  const d = o.days_overdue;
  let tone = d <= 0 ? 0 : d < 15 ? 1 : d <= 45 ? 2 : 3;
  if (tone > 0) tone = Math.min(3, tone + reminders);
  const first = (c.contact_person || "").split(/\s+/)[0] || "";
  return {
    order: o, amount, tone: TONES[tone], days: d,
    person: first.replace(/\.$/, "").length > 1 ? first : c.contact_person,
    vars: {biz: BUSINESS, amt: inr(amount), machine: o.machine, id: o.id, due: fmtDate(due, true), days: d},
  };
}
const fill = (tpl, f) => tpl.replace(/\{(\w+)\}/g, (_, k) => k === "person" ? f.person : f.vars[k]);

function openReminder(customerId) {
  const c = customer(customerId);
  const f = reminderFacts(c);
  let lang = "hinglish";
  openSheet(`
    <form class="sheet-body" method="dialog" id="remind-form">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <h2 class="sheet-title" id="sheet-title">Reminder to ${esc(c.name)}</h2>
          <p class="sheet-sub"><span class="${f.order.overdue > 0.5 ? "late" : ""}">${inr(f.amount)} ${f.order.overdue > 0.5 ? `late, ${f.days} days` : "due " + f.vars.due}</span> · ${esc(f.order.machine)}</p>
        </div>
        <button class="btn btn-link sheet-close" type="button" data-close aria-label="Close">Close</button>
      </div>
      <div class="field">
        <label id="lang-label">Language</label>
        <div class="segmented" role="group" aria-labelledby="lang-label">
          ${LANGS.map(([k, label]) => `<button type="button" data-lang="${k}" aria-pressed="${k === lang}" lang="${k === "hindi" ? "hi" : k === "punjabi" ? "pa" : "en"}">${label}</button>`).join("")}
        </div>
      </div>
      <div class="field">
        <label for="remind-text">Message to ${esc(c.contact_person)} <span class="reminder-tone">· ${TONE_WORDS[f.tone]} tone</span></label>
        <textarea id="remind-text" class="textarea"></textarea>
      </div>
      <div class="sheet-foot">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn-primary" type="submit">Send on WhatsApp</button>
      </div>
    </form>`);
  const text = $("#remind-text", sheet);
  const draft = () => { text.value = fill(TEMPLATES[lang][f.tone], f); text.setSelectionRange(0, 0); text.scrollTop = 0; };
  draft();
  sheet.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    sheet.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", x === b));
    draft();
  }));
  sheet.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  $("#remind-form", sheet).addEventListener("submit", e => {
    e.preventDefault();
    const entry = {id: Date.now(), customer_id: c.id, order_id: f.order.id, date: TODAY, kind: "reminder", language: lang};
    contacts.push(entry);
    closeSheet();
    render();
    toast(`Reminder sent to ${c.name}`, {action: {label: "Undo", onClick: () => {
      contacts.splice(contacts.indexOf(entry), 1);
      render();
    }}});
  });
  text.focus({preventScroll: true});
  text.setSelectionRange(0, 0);
  text.scrollTop = 0;
}

/* ---------- router (becomes static/js/app.js) ---------- */
let lastList = "#today";
function render() {
  const hash = location.hash || "#today";
  const view = $("#view");
  const m = hash.match(/^#customer-(\d+)$/);
  const tab = m ? (lastList === "#customers" ? "customers" : "today") : hash.slice(1);
  document.querySelectorAll("[data-tab]").forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (m) return renderCustomer(view, Number(m[1]));
  if (hash === "#customers") { lastList = hash; return renderCustomers(view); }
  if (hash === "#ask") return renderAsk(view);
  lastList = "#today";
  renderToday(view);
}

function renderAsk(el) {
  const qs = ["Who owes me the most?", "What is due this week?", "Who promised to pay and didn't?"];
  el.innerHTML = `
    <div class="page-head"><h1 class="page-title">Ask</h1><p class="soft">Ask about your customers and payments in your own words.</p></div>
    <div class="ask-suggest">${qs.map(q => `<button class="btn" type="button" data-todo="Answers">${q}</button>`).join("")}</div>
    <form class="ask-form" id="ask-form">
      <label for="ask-input" class="visually-hidden">Your question</label>
      <input id="ask-input" class="input" type="text" placeholder="Type a question" autocomplete="off">
      <button class="btn btn-primary" type="submit">Ask</button>
    </form>
    <p class="ask-status">AI off · answers use the offline helper</p>`;
  $("#ask-form", el).addEventListener("submit", e => { e.preventDefault(); notInMockup("Answers"); });
}

document.addEventListener("click", e => {
  const remind = e.target.closest("[data-remind]");
  if (remind) { e.stopPropagation(); return openReminder(Number(remind.dataset.remind)); }
  const todo = e.target.closest("[data-todo]");
  if (todo) return notInMockup(todo.dataset.todo);
  if (e.target.closest("[data-add-sale]")) return notInMockup("Add sale");
  const row = e.target.closest("[data-customer]");
  if (row) location.hash = `#customer-${row.dataset.customer}`;
});
document.addEventListener("keydown", e => {
  const row = e.target.closest?.("[data-customer]");
  if (row && e.target === row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = `#customer-${row.dataset.customer}`; }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>
